services:
  postgres:
    image: postgres:16-alpine
    container_name: imkon_ads_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imkon_ads}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-imkon_ads}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: imkon_ads_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-imkon_ads}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      sh -c "alembic upgrade head && python app/main.py"

volumes:
  pg_data:
    driver: local
